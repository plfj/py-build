name: Build Python for Android

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches: [ master ]

permissions:
  contents: write

env:
  PYTHON_VERSION:      "3.13.12"
  PYTHON_REVISION:     "3"
  ANDROID_NDK_VERSION: "27.3.13750724"
  ANDROID_API_LEVEL:   "35"
  TERMUX_ARCH:         "arm64"

jobs:
  # ===========================================================================
  # JOB 1 — Apply patches, run autoreconf, pack + upload to GitHub release
  # ===========================================================================
  prepare-source:
    name: Prepare patched source
    runs-on: ubuntu-24.04
    container:
      # Official CPython autoconf image — contains the exact autoconf/automake/
      # aclocal/libtool versions used by CPython release engineers.
      image: ghcr.io/python/autoconf:2024.10.16.11360930377

    outputs:
      release_tag: ${{ steps.release_tag.outputs.tag }}
      source_url:  ${{ steps.release.outputs.assets && fromJSON(steps.release.outputs.assets)[0].browser_download_url || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install host dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            wget curl git make pkg-config \
            xz-utils file ca-certificates

      - name: Verify autoconf version
        run: |
          autoconf --version | head -1
          autoreconf --version | head -1
          which autoconf && which autoreconf

      - name: Prepare and pack patched source
        run: |
          chmod +x build2.sh
          OUTPUT_DIR="${GITHUB_WORKSPACE}/dist" \
          TERMUX_PKG_API_LEVEL="${ANDROID_API_LEVEL}" \
            ./build2.sh

      - name: Show prepared tarball
        run: ls -lh "${GITHUB_WORKSPACE}/dist/"

      - name: Compute release tag
        id: release_tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v${PYTHON_VERSION}-r${PYTHON_REVISION}-dev"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      # softprops/action-gh-release@v2 — creates the release AND uploads assets
      # in one step. Replaces the deprecated actions/create-release@v1 +
      # actions/upload-release-asset@v1 combo.
      - name: Create release and upload patched source tarball
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:   "frt"
          name:       "Python ${{ env.PYTHON_VERSION }}-r${{ env.PYTHON_REVISION }}"
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          body: |
            Termux Python ${{ env.PYTHON_VERSION }} revision ${{ env.PYTHON_REVISION }}
            for Android (API ${{ env.ANDROID_API_LEVEL }}, ${{ env.TERMUX_ARCH }}).

            **Assets:**
            - `python-*-patched-src.tar.xz` — Patched + autoreconf'd source
            - `python_*_arm64.deb` — Termux .deb package ready to install
          files: |
            dist/python-${{ env.PYTHON_VERSION }}-patched-src.tar.xz
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================================================================
  # JOB 2 — Download patched source, cross-compile, upload .deb to same release
  # ===========================================================================
  build-android:
    name: Build .deb for Android
    runs-on: macos-14
    needs: prepare-source

    env:
      # ── Android SDK / NDK ────────────────────────────────────────────────────
      ANDROID_HOME:         ${{ github.workspace }}/android-sdk
      ANDROID_NDK_VERSION:  "27.3.13750724"   # LTS release — ships darwin-x86_64 toolchain
      ANDROID_SDK_VERSION:  "35"
      ANDROID_BUILD_TOOLS:  "35.0.0"
      # ── Termux target ────────────────────────────────────────────────────────
      TERMUX_PKG_API_LEVEL: "35"
      TERMUX_ARCH:          "aarch64"          # canonical form expected by build.sh
      # ── Python package version (must match build.sh TERMUX_PKG_VERSION) ─────
      PYTHON_VERSION:       "3.13.12"
      # ── Install prefix — picked up by build.sh via $PREFIX fallback ─────────
      PREFIX:               ${{ github.workspace }}/prefix

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Host dependencies ─────────────────────────────────────────────────
      # gnu-tar   : build.sh uses 'tar -xJf' and '_create_deb' uses tar; BSD tar
      #             supports -J only with a separate xz binary — simpler to have
      #             gtar available for the unpack step too.
      # xz        : used directly in _create_deb when dpkg-deb is absent.
      # binutils  : provides GNU 'gar' (ar) for building the .deb ar archive;
      #             BSD ar also works but GNU ar is safer for cross-platform debs.
      # nproc     : part of coreutils — used by _detect_cpu_count in build.sh.
      - name: Install host dependencies
        run: |
          set -euo pipefail
          brew install --quiet \
            wget curl git unzip make pkg-config \
            coreutils gawk xz zstd gnu-tar binutils \
            openssl sqlite readline zlib libffi
          # Prepend GNU tool paths so nproc, gtar, gar etc. shadow BSD equivalents
          {
            echo "/opt/homebrew/opt/coreutils/libexec/gnubin"
            echo "/opt/homebrew/opt/gnu-tar/libexec/gnubin"
            echo "/opt/homebrew/opt/binutils/bin"
            echo "/opt/homebrew/opt/openssl/bin"
          } >> "$GITHUB_PATH"
          {
            echo "PKG_CONFIG_PATH=/opt/homebrew/opt/openssl/lib/pkgconfig:/opt/homebrew/opt/readline/lib/pkgconfig:/opt/homebrew/opt/zlib/lib/pkgconfig:/opt/homebrew/opt/libffi/lib/pkgconfig:/opt/homebrew/opt/sqlite/lib/pkgconfig"
            echo "LDFLAGS_HOST=-L/opt/homebrew/opt/openssl/lib -L/opt/homebrew/opt/readline/lib -L/opt/homebrew/opt/zlib/lib"
            echo "CPPFLAGS_HOST=-I/opt/homebrew/opt/openssl/include -I/opt/homebrew/opt/readline/include -I/opt/homebrew/opt/zlib/include"
          } >> "$GITHUB_ENV"

      # ── 3. Android SDK ───────────────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ── 4. NDK ───────────────────────────────────────────────────────────────
      - name: Install Android NDK ${{ env.ANDROID_NDK_VERSION }}
        run: |
          set -euxo pipefail
          mkdir -p "$ANDROID_HOME"
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_SDK_VERSION}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"
          ls -1 "$ANDROID_HOME/ndk/"

      # ── 5. Cross-compile environment ─────────────────────────────────────────
      # NDK 27 ships ONLY darwin-x86_64; it runs via Rosetta 2 on Apple Silicon.
      # ANDROID_API_LEVEL is exported here so the clang target triple is built
      # from the same value as TERMUX_PKG_API_LEVEL (they must match).
      - name: Configure NDK cross-compilation environment
        run: |
          set -euo pipefail
          NDK_PATH="$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"
          PREBUILT="$NDK_PATH/toolchains/llvm/prebuilt"
          echo "=== Available prebuilt toolchains ===" && ls "$PREBUILT"

          if   [ -d "$PREBUILT/darwin-x86_64" ]; then TOOLCHAIN="$PREBUILT/darwin-x86_64"
          elif [ -d "$PREBUILT/darwin-arm64"  ]; then TOOLCHAIN="$PREBUILT/darwin-arm64"
          else echo "No NDK toolchain found under $PREBUILT"; exit 1; fi

          SYSROOT="$TOOLCHAIN/sysroot"

          # Use the same API level for the clang target triple as Termux uses.
          ANDROID_API_LEVEL="${TERMUX_PKG_API_LEVEL}"
          TARGET="aarch64-linux-android${ANDROID_API_LEVEL}"
          CC_BIN="$TOOLCHAIN/bin/${TARGET}-clang"
          CXX_BIN="$TOOLCHAIN/bin/${TARGET}-clang++"

          [ -x "$CC_BIN"  ] || { echo "CC not found: $CC_BIN";  ls "$TOOLCHAIN/bin/" | grep clang; exit 1; }
          [ -x "$CXX_BIN" ] || { echo "CXX not found: $CXX_BIN"; ls "$TOOLCHAIN/bin/" | grep clang; exit 1; }

          echo "$TOOLCHAIN/bin" >> "$GITHUB_PATH"

          {
            echo "CC=$CC_BIN"
            echo "CXX=$CXX_BIN"
            echo "AR=$TOOLCHAIN/bin/llvm-ar"
            echo "AS=$TOOLCHAIN/bin/llvm-as"
            echo "LD=$TOOLCHAIN/bin/ld.lld"
            echo "NM=$TOOLCHAIN/bin/llvm-nm"
            echo "RANLIB=$TOOLCHAIN/bin/llvm-ranlib"
            echo "STRIP=$TOOLCHAIN/bin/llvm-strip"
            echo "OBJDUMP=$TOOLCHAIN/bin/llvm-objdump"
            echo "SYSROOT=$SYSROOT"
            echo "ANDROID_NDK_HOME=$NDK_PATH"
            echo "ANDROID_API_LEVEL=$ANDROID_API_LEVEL"
            echo "CFLAGS=--sysroot=$SYSROOT -target $TARGET"
            echo "CXXFLAGS=--sysroot=$SYSROOT -target $TARGET"
            echo "LDFLAGS=--sysroot=$SYSROOT -fuse-ld=lld"
            echo "ANDROID_BUILD_TARGET=$TARGET"
            echo "TERMUX_STANDALONE_TOOLCHAIN=$TOOLCHAIN"
            echo "TERMUX_PREFIX=${{ github.workspace }}/prefix"
          } >> "$GITHUB_ENV"

      # ── 6. Smoke-test the cross-compiler ─────────────────────────────────────
      - name: Verify cross-compiler
        run: |
          set -euo pipefail
          "$CC" --version
          echo 'int main(void){return 0;}' > /tmp/_cross_test.c
          "$CC" $CFLAGS /tmp/_cross_test.c -o /tmp/_cross_test \
            && echo "Cross-compile smoke test passed" \
            || { echo "Cross-compile smoke test FAILED"; exit 1; }

      # ── 7. Prefix directory ───────────────────────────────────────────────────
      - name: Prepare output prefix
        run: mkdir -p "${{ github.workspace }}/prefix"

      # ── 8. Wipe stale dep build trees ────────────────────────────────────────
      # Previous failed runs may leave a ncurses source tree with a Makefile in
      # /tmp/python-build/deps-build/. If libncursesw.a/.so is absent from
      # deps/ but the source tree is present, make could pick it up erroneously.
      # Nuke deps-build/ (not deps/ — we want to keep downloaded/extracted libs).
      - name: Clean stale dependency build trees
        run: |
          rm -rf /tmp/python-build/deps-build /private/tmp/python-build/deps-build
          # Also remove any ncurses artifacts from a previous partial run so the
          # extraction + header-shim logic always reruns with a clean slate.
          rm -f  /tmp/python-build/deps/lib/libncurses*.{a,so}* \
                 /tmp/python-build/deps/include/curses.h \
                 /tmp/python-build/deps/include/ncurses.h \
                 /tmp/python-build/deps/include/ncursesw \
                 /tmp/python-build/deps/include/ncurses \
                 /private/tmp/python-build/deps/lib/libncurses*.{a,so}* \
                 /private/tmp/python-build/deps/include/curses.h \
                 /private/tmp/python-build/deps/include/ncursesw \
                 /private/tmp/python-build/deps/include/ncurses \
                 2>/dev/null || true

      # ── 9. Build ─────────────────────────────────────────────────────────────
      # The patched source tarball lives under the permanent tag 'frt', not
      # under the per-run release tag produced by prepare-source.
      # build.sh auto-skips module verification because it detects a
      # cross-compile context (host cannot exec Android ELF binaries).
      - name: Build Python for Android
        env:
          RELEASE_TAG:  "frt"
          OUTPUT_DIR:   ${{ github.workspace }}/dist
        run: |
          set -euxo pipefail

          # Validate that prepare-source actually exported a release tag
          # (still needed for the .deb upload step below).
          if [[ -z "${RELEASE_TAG:-}" ]]; then
            echo "ERROR: RELEASE_TAG is empty — prepare-source job did not expose release_tag as an output."
            exit 1
          fi

          # The patched source tarball is uploaded under the permanent tag 'frt',
          # independent of the per-run release tag. Update 'frt' here if you ever
          # re-upload the tarball under a different tag.
          export PATCHED_SOURCE_URL="https://github.com/${{ github.repository }}/releases/download/frt/python-${PYTHON_VERSION}-patched-src.tar.xz"
          echo "PATCHED_SOURCE_URL=${PATCHED_SOURCE_URL}"

          mkdir -p dist
          chmod +x build.sh
          ./build.sh

      # ── 10. Show artifacts ─────────────────────────────────────────────────────
      - name: Show build output
        if: always()
        run: |
          echo "=== prefix/bin ===" && ls -lh "${{ github.workspace }}/prefix/bin" 2>/dev/null || echo "(empty)"
          echo "=== dist/ ==="      && ls -lh dist/                                2>/dev/null || echo "(empty)"

      # ── 11. Upload .deb to release ────────────────────────────────────────────
      - name: Upload .deb to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "frt"
          files:    dist/python_*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
